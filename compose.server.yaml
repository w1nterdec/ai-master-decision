# Use this file on its own: docker compose -f compose.server.yaml up --build -d
name: ai-master-decision-server

services:
  app:
    build: .
    environment:
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_SERVER_ADDRESS: "${APP_DOMAIN:?Set APP_DOMAIN in .env}"
      STREAMLIT_BROWSER_SERVER_PORT: "443"
    volumes:
      - decision-state:/state
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN in .env}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env}"
      BASIC_AUTH_PASSWORD_HASH: "${BASIC_AUTH_PASSWORD_HASH:?Generate a password hash and set BASIC_AUTH_PASSWORD_HASH in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  decision-state:
  caddy-data:
  caddy-config:

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-master-decision"
version = "1.1.0"
description = "AI 硕士证据化择校工作台：资料检索、路径对比、偏好与决策解释"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "SQLAlchemy>=2.0,<2.2",
    "pydantic>=2.5,<3.0",
    "openpyxl>=3.1",
    # Phase 4.1 新增：Web MVP 运行依赖
    # - streamlit：任务书指定的 Web 框架（本阶段交付形态为可操作 Web 工作台）
    # - pandas：页面表格（st.dataframe）与统计口径展示的数据容器
    "streamlit>=1.50,<1.67",
    "pandas>=2.2,<3.2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.9,<1",
]

# 显式列出包（使用 packages.find 的 `where` 在 setuptools >=81 与 <81 的 schema 不兼容，
# 为保证干净环境可安装，这里采用显式列表）。
[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "decision_system",
    "decision_system.models",
    "decision_system.schemas",
    "decision_system.evidence",
    "decision_system.engine",
    "decision_system.importers",
    "decision_system.services",
    "decision_system.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["data/raw", "reports"]

[tool.ruff.lint]
# Catch undefined names and invalid syntax across legacy and new modules.
select = ["E9", "F63", "F7", "F82"]

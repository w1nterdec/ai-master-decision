[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-master-decision"
version = "0.5.2"
description = "2028 AI 硕士动态择校系统：数据架构、证据治理、独立决策引擎、Streamlit MVP 与北邮试点迁移 (Phase 4.0 + 4.1 + 5.0)"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "pydantic>=2.5,<3.0",
    "openpyxl>=3.1",
    # Phase 4.1 新增：Web MVP 运行依赖
    # - streamlit：任务书指定的 Web 框架（本阶段交付形态为可操作 Web 工作台）
    # - pandas：页面表格（st.dataframe）与统计口径展示的数据容器
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

# 显式列出包（使用 packages.find 的 `where` 在 setuptools >=81 与 <81 的 schema 不兼容，
# 为保证干净环境可安装，这里采用显式列表）。
[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "decision_system",
    "decision_system.models",
    "decision_system.schemas",
    "decision_system.evidence",
    "decision_system.engine",
    "decision_system.importers",
    "decision_system.services",
    "decision_system.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

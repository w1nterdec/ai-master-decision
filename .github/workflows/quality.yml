name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/bootstrap.py
      - run: python scripts/check_data.py
      - run: python scripts/check_secrets.py --history
      - run: python -m ruff check .
      - run: python -m pytest --junitxml=reports/quality-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: reports/quality-junit.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-master-decision:test .
      - name: Start and verify health
        shell: bash
        run: |
          docker run -d --name decision-test -p 127.0.0.1:8501:8501 ai-master-decision:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs decision-test
          exit 1
      - name: Render actual container pages
        run: docker exec decision-test python scripts/smoke_app.py
      - name: Verify server HTTPS and authentication
        shell: bash
        run: |
          export APP_DOMAIN=localhost BASIC_AUTH_USER=ci
          password=$(openssl rand -hex 24)
          export BASIC_AUTH_PASSWORD_HASH
          BASIC_AUTH_PASSWORD_HASH=$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext "$password")
          if BASIC_AUTH_PASSWORD_HASH='' docker compose -f compose.server.yaml config --quiet >/dev/null 2>&1; then
            echo 'Server configuration incorrectly accepts an empty password hash'
            exit 1
          fi
          docker compose -f compose.server.yaml config --quiet
          trap 'docker compose -f compose.server.yaml logs --tail=80; docker compose -f compose.server.yaml down' EXIT
          docker compose -f compose.server.yaml up --build -d --wait --wait-timeout 180
          docker compose -f compose.server.yaml exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # Only CI uses a local Caddy CA; real deployment must use trusted HTTPS.
          for attempt in $(seq 1 30); do
            status=$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://localhost || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 2
          done
          test "$status" = 401
          test "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' -u "ci:$password" https://localhost)" = 200
          test "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' -u 'ci:wrong-password' https://localhost)" = 401
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose -f compose.server.yaml ps -q app)")" = 0
      - name: Container logs
        if: always()
        run: docker logs decision-test
